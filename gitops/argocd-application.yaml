# Argo CD watches this repo and keeps the cluster equal to what is in Git.
#   kubectl apply -n argocd -f gitops/argocd-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: expensetrail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NoiceHax/expensetrail.git
    targetRevision: main
    path: helm/expensetrail
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: REPLACE_WITH_COMMIT_SHA   # CI updates this line after pushing a new image
  destination:
    server: https://kubernetes.default.svc
    namespace: expensetrail
  syncPolicy:
    automated:
      prune: true       # remove objects deleted from Git
      selfHeal: true    # revert manual kubectl edits
    syncOptions:
      - CreateNamespace=true
