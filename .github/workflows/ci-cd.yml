name: ExpenseTrail CI/CD

# push to main -> test, build frontend, security checks -> build, Trivy-scan and push images to GHCR (tagged with the commit SHA)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests (fails the build on any failure)
        run: pytest -v --cov=app --cov-report=term-missing

  frontend:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: ls -la dist

  security:
    name: Security checks (SAST, SCA, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not just the tip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SAST with Bandit
        run: pip install bandit && bandit -r application/backend/app
      - name: SCA with pip-audit (pinned dependencies)
        run: pip install pip-audit && pip-audit -r application/backend/requirements.txt
      - name: Secret scan with gitleaks
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:latest \
            detect --source /repo --redact --no-banner

  images:
    name: Build, scan and push (${{ matrix.service }})
    needs: [test, frontend, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Image name (Docker requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/expensetrail-${{ matrix.service }}" >> "$GITHUB_ENV"
      - name: Build
        run: docker build -t "$IMAGE:${{ github.sha }}" application/${{ matrix.service }}
      - name: Trivy scan (fails on fixable HIGH or CRITICAL CVEs)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE:${{ github.sha }}"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push (SHA tag, the same image that was scanned)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:${{ github.sha }}"

  helm:
    name: Helm chart lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/expensetrail
      - run: helm template expensetrail helm/expensetrail --set image.tag=ci > /dev/null
