{{- /* Generate the DB password once; on upgrades keep the one already in the cluster. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "expensetrail-db" -}}
apiVersion: v1
kind: Secret
metadata:
  name: expensetrail-db
  labels: {{- include "et.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
