# Whole stack with one command:  docker compose -f docker/docker-compose.yml up --build
# Development defaults only. Real deployments take credentials from a Secret / secret manager.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-expensetrail}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  backend:
    build: ../application/backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-expense}:${POSTGRES_PASSWORD:-expense-dev-only}@postgres:5432/${POSTGRES_DB:-expensetrail}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  frontend:
    build: ../application/frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    mem_limit: 64m

volumes:
  pgdata:
