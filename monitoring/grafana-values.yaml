# helm install grafana grafana/grafana -n monitoring -f monitoring/grafana-values.yaml
# kubectl -n monitoring create configmap expensetrail-dashboard --from-file=monitoring/expensetrail-dashboard.json
persistence:
  enabled: false
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}
adminUser: admin          # the password is generated by the chart: kubectl -n monitoring get secret grafana -o jsonpath='{.data.admin-password}' | base64 -d
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prom
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: expensetrail
        folder: ExpenseTrail
        type: file
        options:
          path: /var/lib/grafana/dashboards/expensetrail
dashboardsConfigMaps:
  expensetrail: expensetrail-dashboard
